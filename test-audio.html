<!DOCTYPE html>
<html>
<head>
    <title>Medical AI Assistant</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #f4f7f9;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        #container {
            width: 100%;
            max-width: 800px;
            background-color: #fff;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            border-radius: 8px;
            padding: 2rem;
            box-sizing: border-box;
        }
        h1 {
            color: #007aff;
            text-align: center;
        }
        p {
            text-align: center;
            color: #666;
        }
        #controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
        }
        button {
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            background-color: #007aff;
            color: white;
            transition: background-color 0.3s ease;
        }
        button:hover {
            background-color: #0056b3;
        }
        button:disabled {
            background-color: #cddc39;
            cursor: not-allowed;
        }
        #status {
            text-align: center;
            margin-bottom: 1rem;
            color: #666;
        }
        #results {
            border: 1px solid #e0e0e0;
            padding: 1rem;
            height: 300px;
            overflow-y: auto;
            background-color: #f9f9f9;
            border-radius: 8px;
        }
        .message {
            padding: 0.5rem 1rem;
            margin-bottom: 0.5rem;
            border-radius: 15px;
        }
        .You {
            background-color: #007aff;
            color: white;
            align-self: flex-end;
            text-align: right;
        }
        .Eva {
            background-color: #e5e5ea;
            color: #333;
            align-self: flex-start;
        }
        .error {
            background-color: #ff3b30;
            color: white;
        }
        input[type="text"] {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ccc;
            border-radius: 8px;
            margin-bottom: 1rem;
        }
        audio {
            width: 100%;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div id="container">
        <h1>Medical AI Assistant</h1>
        <p>Your personal health companion, powered by AI.</p>
    
    <div>
        <button id="start">🎤 Start Recording</button>
        <button id="stop" disabled>⏹️ Stop Recording</button>
        <button id="clear">🗑️ Clear Results</button>
    </div>
    
    <div id="status" class="disconnected">Not connected</div>
    
    <h3>Results:</h3>
    <div id="results"></div>

    <script>
        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;

        const statusDiv = document.getElementById('status');
        const resultsDiv = document.getElementById('results');
        const startBtn = document.getElementById('start');
        const stopBtn = document.getElementById('stop');
        const clearBtn = document.getElementById('clear');
        const textInput = document.createElement('input');
        textInput.type = 'text';
        textInput.placeholder = 'Or type your message here';
        const sendBtn = document.createElement('button');
        sendBtn.textContent = 'Send';
        const audioPlayer = document.createElement('audio');
        audioPlayer.controls = true;

        document.querySelector('div').appendChild(textInput);
        document.querySelector('div').appendChild(sendBtn);
        document.body.appendChild(audioPlayer);

        function addMessage(type, data) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            messageDiv.innerHTML = `<strong>${type}:</strong> ${data}`;
            resultsDiv.appendChild(messageDiv);
        }

        async function sendToServer(prompt) {
            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt }),
                });
                const data = await response.json();
                addMessage('Eva', data.response);
                const ttsResponse = await fetch('/text-to-speech', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: data.response }),
                });
                const audioBlob = await ttsResponse.blob();
                const audioUrl = URL.createObjectURL(audioBlob);
                audioPlayer.src = audioUrl;
                audioPlayer.play();
            } catch (error) {
                addMessage('error', error.toString());
            }
        }

        startBtn.onclick = async () => {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);
            mediaRecorder.start();
            isRecording = true;
            startBtn.disabled = true;
            stopBtn.disabled = false;
            statusDiv.textContent = 'Recording...';
            audioChunks = [];
            mediaRecorder.ondataavailable = event => {
                audioChunks.push(event.data);
            };
        };

        stopBtn.onclick = () => {
            mediaRecorder.stop();
            isRecording = false;
            startBtn.disabled = false;
            stopBtn.disabled = true;
            statusDiv.textContent = 'Not recording';
            mediaRecorder.onstop = async () => {
                const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                const formData = new FormData();
                formData.append('audio', audioBlob);
                try {
                    const response = await fetch('/transcribe', {
                        method: 'POST',
                        body: formData,
                    });
                    const data = await response.json();
                    addMessage('You', data.transcription);
                    sendToServer(data.transcription);
                } catch (error) {
                    addMessage('error', error.toString());
                }
            };
        };

        sendBtn.onclick = () => {
            const text = textInput.value;
            if (text) {
                addMessage('You', text);
                sendToServer(text);
                textInput.value = '';
            }
        };

        clearBtn.onclick = () => {
            resultsDiv.innerHTML = '';
        };
    </script>
</body>
</html>
